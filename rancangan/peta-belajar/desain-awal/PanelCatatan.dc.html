<div style="width: 360px; height: 800px; overflow: hidden; background: #F6F7F9; color: #111A27; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; position: relative;">

  <div role="img" aria-label="Pemutar resmi YouTube, dijeda di menit 01:17" style="width: 360px; height: 203px; flex: none; background: #0B0F15; color: #6B7686; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; border-top: 1px dashed #2A3647; border-bottom: 1px dashed #2A3647;">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9v6M14 9v6"/></svg>
    <span style="font-size: 13px; font-weight: 600;">Pemutar resmi YouTube · dijeda 01:17</span>

  <div aria-hidden="true" style="flex: 1; background: rgba(17,26,39,0.32);"></div>

  <section role="dialog" aria-label="Tulis catatan" style="position: absolute; left: 0; right: 0; bottom: 0; top: 259px; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 24px rgba(17,26,39,0.12); display: flex; flex-direction: column; padding: 0 16px 16px; box-sizing: border-box;">
    <div style="height: 28px; display: flex; align-items: center; justify-content: center;"><span style="width: 32px; height: 4px; border-radius: 2px; background: #9AA6B6;"></span></div>

    <div role="tablist" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 48px; border-bottom: 1px solid #E1E5EB;">
      <button type="button" role="tab" aria-selected="true" style="border: 0; background: transparent; color: #1D3B70; font: 700 15px 'Plus Jakarta Sans', sans-serif; box-shadow: inset 0 -3px 0 #1D3B70;">Catatan</button>
      <button type="button" role="tab" aria-selected="false" style="border: 0; background: transparent; color: #4B5667; font: 600 15px 'Plus Jakarta Sans', sans-serif;">Pertanyaan</button>
      <button type="button" role="tab" aria-selected="false" style="border: 0; background: transparent; color: #4B5667; font: 600 15px 'Plus Jakarta Sans', sans-serif;">Kesimpulan</button>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; padding: 14px 0 10px;">
      <span style="height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 16px; background: #E7EDF8; color: #1D3B70; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Menit 01:17</span>
      <span style="font-size: 12px; color: #4B5667;">ditempel otomatis</span>
    </div>

    <label for="isi-catatan" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Isi catatan</label>
    <textarea id="isi-catatan" style="height: 132px; resize: none; box-sizing: border-box; border: 1.5px solid #1D3B70; border-radius: 12px; padding: 14px; font: 16px/1.5 'Plus Jakarta Sans', sans-serif; color: #111A27; outline: none;">Tahan klip, lalu geser ke kiri untuk memotong. Ujung yang dipotong bisa dikembalikan.</textarea>

    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0;">
      <button type="button" style="height: 40px; padding: 0 14px 0 10px; border: 0; border-radius: 20px; background: #F6F7F9; color: #1D3B70; font: 700 13px 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; gap: 6px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Tahan untuk bicara</button>

    <p style="margin: 0; font-size: 12px; color: #4B5667; line-height: 1.5; display: flex; gap: 8px; background: #F6F7F9; border-radius: 12px; padding: 10px 12px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px;"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      Catatan hanya bisa dibaca kamu. Jangan tulis nomor HP, NIK, atau alamat.
    </p>

    <div style="flex: 1;"></div>

    <div style="display: flex; gap: 8px;">
      <a href="Belajar.dc.html" style="height: 52px; padding: 0 22px; border-radius: 26px; border: 1.5px solid #9AA6B6; box-sizing: border-box; color: #1D3B70; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Batal</a>
      <a href="Belajar.dc.html" style="flex: 1; height: 52px; border-radius: 26px; background: #1D3B70; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Simpan &amp; lanjutkan</a>
    </div>
  </section>
</div>
