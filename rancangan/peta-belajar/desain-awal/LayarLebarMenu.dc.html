    </div>

    <div role="radiogroup" aria-label="Jenis isian" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
      <button type="button" role="radio" aria-checked="true" style="height: 48px; border: 0; border-radius: 12px; background: #9DBBF2; color: #0D131C; font: 700 13px 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>Beri catatan</button>

      <button type="button" role="radio" aria-checked="false" style="height: 48px; border: 1px solid #2A3647; border-radius: 12px; background: #1C2735; color: #E9EEF5; font: 600 13px 'Plus Jakarta Sans', sans-serif;">Tarik 1 kesimpulan</button>

    <label for="isi-lebar" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Isi catatan</label>
    <textarea id="isi-lebar" placeholder="Tulis yang baru kamu pahami" style="flex: 1; min-height: 0; resize: none; box-sizing: border-box; border: 1.5px solid #9DBBF2; border-radius: 12px; padding: 12px; background: #0D131C; font: 15px/1.5 'Plus Jakarta Sans', sans-serif; color: #E9EEF5; outline: none;">Klip bisa dibelah dua dengan tombol Pisah, lalu bagian yang tidak perlu dihapus.</textarea>
